common:
    lid_topic:  "/livox/Pointcloud2_local"
    imu_topic:  "/trunk_imu_specific"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
                                 # 4 for MARSIM / Gazebo simulation point cloud (direct registration)
    scan_line: 4
    blind: 0.2

mapping:
    acc_cov: 0.1
    gyr_cov: 0.0001
    b_acc_cov: 0.0001
    b_gyr_cov: 0.00000001
    # ASYMMETRIC trust: the two halves of the ESIKF state need opposite handling in
    # this SimEnv corridor, because the two IMU channels have opposite reliability
    # as position/orientation references for a WALKING quadruped.
    #
    #   gyr_cov (rotation): the corridor scan matching is ROTATION-DEGENERATE (the
    #     45-deg-pitched lidar's 3-D scan cannot observe yaw), so it actively
    #     CORRUPTS yaw during in-place/180-deg turns.  The trunk gyro is noiseless
    #     (gaussianNoise=0.0), so lowering gyr_cov/b_gyr_cov ~1000x makes the ESIKF
    #     trust pure gyro integration for attitude -> yaw error 9.7deg -> ~2.3deg.
    #
    #   acc_cov (translation): the corridor scan matching IS translation-observable
    #     (wall/floor range constrains x,y), so it is the ONLY reliable position
    #     source.  The trunk accelerometer, even noiseless, CANNOT be trusted for
    #     position on a walking robot: during a turn the trunk leans (pitch/roll),
    #     the gravity compensation mis-subtracts g, and the spurious transient
    #     acceleration integrates into a METRE-SCALE position jump (measured: a
    #     single turn jumped the pose 0.2m -> 4.1m and it never recovered).  So
    #     acc_cov/b_acc_cov stay at the DEFAULT high values -> scan matching keeps
    #     correcting translation while gyro integration handles yaw.
    fov_degree:    90
    det_range:     50.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    # SimEnv mounts the Mid360 pitched up 45 deg about Y on the trunk:
    #   laser_livox_joint  rpy="0 0.785 0"  xyz="0.2 0 0.08"  (parent base == imu_link)
    # FAST-LIO2 transforms lidar points into the IMU/body frame as
    #   p_imu = extrinsic_R * p_lidar + extrinsic_T,
    # so extrinsic_R = Ry(+45 deg) and extrinsic_T = the lidar lever arm.
    extrinsic_T: [ 0.2, 0.0, 0.08 ]
    extrinsic_R: [ 0.7071068, 0, 0.7071068,
                   0,         1, 0,
                   -0.7071068, 0, 0.7071068]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false           # FAST-LIO2's own PCD dump is disabled; save_pcd.py
                                 # writes the accumulated cloud after exploration.
    interval: -1                 # how many LiDAR frames saved in each pcd file;
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

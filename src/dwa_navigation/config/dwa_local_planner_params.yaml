DWAPlannerROS:
  # ============================================================
  # Velocity — target 4.0 m/s on straightaways
  # ============================================================
  max_vel_x: 4.0
  min_vel_x: -0.8
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 4.0
  min_vel_trans: 0.4
  trans_stopped_vel: 0.1

  # Acceleration — first step at 20 Hz must reach min_vel_trans
  #   acc_lim / 20 Hz >= 0.3 → acc_lim >= 6.0
  acc_lim_trans: 12.0
  acc_lim_x: 12.0
  acc_lim_y: 0.0

  # Rotation
  max_vel_theta: 3.0
  min_vel_theta: 1.5
  theta_stopped_vel: 0.05
  acc_lim_theta: 8.0

  # Goal tolerance
  yaw_goal_tolerance: 0.3
  xy_goal_tolerance: 0.3
  latch_xy_goal_tolerance: false

  # ============================================================
  # Forward simulation — 4.0 m/s × 1.0 s = 4.0 m lookahead
  #   Balanced: reactive enough for turns, far enough for speed
  # ============================================================
  sim_time: 1.2
  sim_granularity: 0.05
  vx_samples: 60
  vy_samples: 1
  vtheta_samples: 120

  # ============================================================
  # Scoring — path-dominant (3.2:1 ratio)
  #   path_distance_bias (64)  → tightly follow global plan
  #   goal_distance_bias (20)  → weaker goal pull, prevents corner-cutting
  #   occdist_scale  (0.01)    → minimal obstacle slowdown
  # ============================================================
  path_distance_bias: 64.0
  goal_distance_bias: 20.0
  occdist_scale: 0.01
  forward_point_distance: 1.2
  stop_time_buffer: 0.5
  scaling_speed: 0.5
  max_scaling_factor: 0.15

  # Oscillation prevention
  oscillation_reset_dist: 0.08

  # Debug
  publish_traj_pc: true
  publish_cost_grid_pc: true
  global_frame_id: odom

  # Differential drive (non-holonomic)
  holonomic_robot: false

local_costmap:
  global_frame: odom
  robot_base_frame: base
  static_map: false
  rolling_window: true
  width: 15.0
  height: 15.0
  resolution: 0.05
  update_frequency: 20.0
  publish_frequency: 20.0
  transform_tolerance: 1.0

# Plugins
plugins:
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

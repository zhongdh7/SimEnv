# Shared costmap parameters for both global and local costmaps
#   footprint: exact robot polygon (Unitree A1 body ~0.5m × 0.3m)
#   inflation_radius: max distance costs are propagated from footprint edge
#   cost_scaling_factor: how fast cost decays (lower = slower decay = wider gradient)
#   cost = 252 * exp(-factor * distance_from_footprint)
#
#   Footprint 0.50×0.30 rectangle + inflation 0.30:
#     In front of robot: lethal zone extends 0.25+0.30=0.55m (safe for length)
#     To sides of robot: lethal zone extends 0.15+0.30=0.45m (was 0.50m with circle)
#     → 0.05m MORE clearance on each side for narrow passages
footprint: [[-0.25, -0.15], [-0.25, 0.15], [0.25, 0.15], [0.25, -0.15]]
inflation_radius: 0.8
cost_scaling_factor: 25
obstacle_range: 8.0
raytrace_range: 15.0

observation_sources: base_lidar

base_lidar:
  data_type: LaserScan
  topic: /scan_laser
  sensor_frame: base
  marking: true
  clearing: true
  inf_is_valid: true
  expected_update_rate: 10.0

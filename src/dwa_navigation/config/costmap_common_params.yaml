# Shared costmap parameters for both global and local costmaps
#   inflation_radius: max distance costs are propagated from obstacles
#   cost_scaling_factor: how fast cost decays (lower = slower decay = wider gradient)
#   cost = 252 * exp(-factor * (distance - robot_radius))
#
#   With robot_radius=0.2, inflation=0.5, factor=10:
#     d=0.25m: cost=153               — high cost (near lethal)
#     d=0.30m: cost=93                — orange
#     d=0.40m: cost=34                — yellow (DWA starts avoiding)
#     d=0.50m: cost≈0                 — clear
#
#   Wider gradient (factor=10, was 20) + moderate inflation (0.5m, was 0.8m)
#   prevents robot from getting stuck near obstacles.
robot_radius: 0.2
inflation_radius: 0.5
cost_scaling_factor: 10
obstacle_range: 8.0
raytrace_range: 15.0

observation_sources: base_lidar

base_lidar:
  data_type: LaserScan
  topic: /scan_laser
  sensor_frame: base
  marking: true
  clearing: true
  inf_is_valid: true
  expected_update_rate: 10.0

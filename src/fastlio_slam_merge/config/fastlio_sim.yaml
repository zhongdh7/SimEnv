common:
    lid_topic:  "/livox/Pointcloud2_local"
    imu_topic:  "/trunk_imu_specific"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
                                 # 4 for MARSIM / Gazebo simulation point cloud
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    90
    det_range:     50.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    # SimEnv mounts the Mid360 pitched up 45 deg about Y on the trunk:
    #   laser_livox_joint  rpy="0 0.785 0"  xyz="0.2 0 0.08"  (parent base == imu_link)
    # FAST-LIO transforms lidar points into the IMU/body frame as
    #   p_imu = extrinsic_R * p_lidar + extrinsic_T,
    # so extrinsic_R = Ry(+45 deg) and extrinsic_T = the lidar lever arm.
    extrinsic_T: [ 0.2, 0.0, 0.08 ]
    extrinsic_R: [ 0.7071068, 0, 0.7071068,
                   0,         1, 0,
                   -0.7071068, 0, 0.7071068]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false           # FAST-LIO's own PCD dump is disabled; save_pcd.py
                                 # writes the accumulated cloud after exploration.
    interval: -1                 # how many LiDAR frames saved in each pcd file;
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

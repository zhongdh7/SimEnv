# Topics observed in the running SimEnv ROS Noetic simulation.
image_topic: /real_sense/rgb/image_raw
detections_topic: /hazard_perception/detections
mask_topic: /hazard_perception/red_mask
debug_image_topic: /hazard_perception/debug_image

# OpenCV hue uses [0, 179]. Red wraps around the hue boundary, hence two ranges.
hue_low_1: 0
hue_high_1: 10
hue_low_2: 170
hue_high_2: 179
saturation_min: 100
saturation_max: 255
value_min: 70
value_max: 255

# All kernel sizes must be positive odd integers.
blur_kernel_size: 3
morphology_kernel_size: 5
open_iterations: 1
close_iterations: 2

# Contour geometry filters for the 640x480 RealSense RGB stream.
min_area: 120.0
max_area: 120000.0
min_circularity: 0.68
min_aspect_ratio: 0.70
max_aspect_ratio: 1.30

# Border-touching targets use a separate visible-arc circle fit. Ordinary
# targets still use the unchanged circularity/aspect-ratio gates above.
border_margin_px: 2
edge_min_area: 45.0
edge_min_arc_points: 5
edge_min_radius_px: 4.0
edge_max_arc_residual: 0.16
